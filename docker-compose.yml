# ==============================================================================
# MP3Spot — Dockhand / Portainer Docker Compose Stack (GitHub Built Image)
#
# GitHub Actions (.github/workflows/docker-publish.yml) bouwt automatisch de
# Docker image bij elke push en publiceert deze naar GitHub Container Registry.
# Geen "command:" of git-clone script meer nodig in deze docker-compose.yml!
# ==============================================================================

services:
  mp3spot:
    image: ${MP3SPOT_IMAGE:-ghcr.io/ckb-k28/mp3spot:latest}
    pull_policy: always
    container_name: mp3spot
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # --- Spotify Developer API Gegevens (optioneel) ---
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - APP_URL=${APP_URL:-http://localhost:3000}
      # --- Geïsoleerde Container Volume Paden ---
      - MUSIC_LIBRARY_PATH=/music
      - DATA_PATH=/data
      - EXPORTS_PATH=/exports
    volumes:
      # 1. Lokale muziekmap: Koppel je muziekmap (:rw zodat MP3Spot Spotify ID3-tags kan bijschrijven)
      - ${HOST_MUSIC_PATH:-/mnt/nas/muziek}:/music:rw
      # 2. Persistente App Data: Bewaart database, match-historie, OAuth en playlistregels
      - ${HOST_DATA_PATH:-mp3spot_data}:/data
      # 3. Afspeellijst Exports: Schrijft .m3u8, .json en .csv bestanden direct naar je host/NAS
      - ${HOST_EXPORTS_PATH:-./exports}:/exports

volumes:
  mp3spot_data:

